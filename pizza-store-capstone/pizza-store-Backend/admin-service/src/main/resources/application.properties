# ===== Server =====
server.port=8082
spring.application.name=admin-service

# ===== MySQL Database =====
# 'createDatabaseIfNotExist=true' auto-creates the DB on first run.
# Change username/password to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/pizza_admin_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== Eureka (service registry) =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# ===== JWT (same secret in every service so any service can verify any token) =====
app.jwt.secret=cGl6emEtc3RvcmUtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNS1jYXBzdG9uZS1wcm9qZWN0LXNlY3VyZQ==
app.jwt.expiration-ms=86400000

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
