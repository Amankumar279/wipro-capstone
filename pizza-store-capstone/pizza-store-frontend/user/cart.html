<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pizza Store — Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="../index.html">🍕 Pizza Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </div>
</nav>

<!-- Page Header Banner -->
<div class="page-banner">
    <div class="container">
        <span class="page-banner-tag">Checkout</span>
        <h1 class="page-banner-title">Your Cart 🛒</h1>
        <p class="page-banner-desc">Review your items, choose your delivery option, and complete your order.</p>
    </div>
</div>

<div class="container" style="padding-bottom: 80px;">
    <div id="alertBox"></div>

    <div class="row g-4">
        <!-- Left side: cart items -->
        <div class="col-md-8">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                <span>Selected Items</span>
            </h5>
            <div id="cartItems"></div>
        </div>

        <!-- Right side: checkout -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3" style="border-radius: var(--radius-md); background: #ffffff;">
                <div class="card-body">
                    <h4 class="fw-bold mb-4 text-main">Summary</h4>

                    <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                        <span class="text-muted">Total Amount</span>
                        <span class="fs-4 fw-extrabold text-primary">₹<span id="totalAmount">0</span></span>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase small tracking-wide text-muted fw-bold">Delivery Mode</label>
                        <select class="form-select py-3" id="deliveryMode">
                            <option value="HOME_DELIVERY">🛵 Home Delivery</option>
                            <option value="TAKEAWAY">🛍️ Takeaway</option>
                        </select>
                    </div>

                    <div class="mb-4" id="addressBox">
                        <label class="form-label text-uppercase small tracking-wide text-muted fw-bold">Delivery Address</label>
                        <textarea class="form-control" id="address" rows="3" placeholder="Enter your full street address details..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase small tracking-wide text-muted fw-bold">Payment Mode</label>
                        <select class="form-select py-3" id="paymentMode">
                            <option value="CARD">💳 Credit / Debit Card</option>
                            <option value="UPI">📱 UPI / QR</option>
                            <option value="NET_BANKING">🏦 Net Banking</option>
                            <option value="WALLET">👛 Digital Wallet</option>
                            <option value="COD">💵 Cash on Delivery</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100 py-3 mt-2 fs-6 fw-bold" id="placeOrderBtn">
                        🚀 Place Order Now
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/cart.js"></script>
</body>
</html>
