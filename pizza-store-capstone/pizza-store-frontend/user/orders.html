<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pizza Store — My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="../index.html">🍕 Pizza Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </div>
</nav>

<!-- Page Header Banner -->
<div class="page-banner">
    <div class="container">
        <span class="page-banner-tag">History</span>
        <h1 class="page-banner-title">My Orders 📦</h1>
        <p class="page-banner-desc">View your order details, real-time statuses, and invoice records.</p>
    </div>
</div>

<div class="container" style="padding-bottom: 80px;">
    <div id="alertBox"></div>

    <!-- Stats summary bar -->
    <div class="card mb-5 border-0 shadow-sm" style="border-radius: var(--radius-md); overflow: hidden; background: #ffffff;">
        <div class="card-body p-4">
            <div class="row align-items-center text-center text-md-start">
                <div class="col-md-6 mb-3 mb-md-0 d-flex align-items-center gap-3 justify-content-center justify-content-md-start">
                    <span class="fs-1">💰</span>
                    <div>
                        <h6 class="text-muted small text-uppercase fw-bold mb-1">Total Expenditure</h6>
                        <h3 class="fw-extrabold text-primary mb-0">₹<span id="grandTotal">0</span></h3>
                    </div>
                </div>
                <div class="col-md-6 d-flex align-items-center gap-3 justify-content-center justify-content-md-start border-md-start" style="border-left: 1px solid rgba(0,0,0,0.08);">
                    <span class="fs-1">📦</span>
                    <div>
                        <h6 class="text-muted small text-uppercase fw-bold mb-1">Orders Placed</h6>
                        <h3 class="fw-extrabold text-dark mb-0"><span id="orderCount">0</span> Orders</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h5 class="fw-bold mb-4 text-main">Order List</h5>
    <div id="ordersList">
        <p class="text-muted">Loading orders...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/orders.js"></script>
</body>
</html>
