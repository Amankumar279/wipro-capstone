<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Pizza Store — Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="../index.html">🍕 Pizza Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </div>
</nav>

<!-- Page Header Banner -->
<div class="page-banner">
    <div class="container">
        <span class="page-banner-tag">Settings</span>
        <h1 class="page-banner-title">My Profile 👤</h1>
        <p class="page-banner-desc">Manage your account information, contact settings, and default delivery details.</p>
    </div>
</div>

<div class="container" style="padding-bottom: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm overflow-hidden" style="border-radius: var(--radius-md); background: #ffffff;">
                <!-- Profile Avatar header area -->
                <div class="text-center py-4" style="background: rgba(225, 29, 72, 0.02); border-bottom: 1px solid rgba(0,0,0,0.05);">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow-sm border" style="width: 90px; height: 90px; font-size: 2.8rem; margin-bottom: 10px;">
                        👤
                    </div>
                    <h5 class="fw-bold mb-0 text-main">Personal Information</h5>
                </div>
                <div class="card-body p-4">
                    <div id="alertBox"></div>

                    <form id="profileForm">
                        <div class="mb-4">
                            <label class="form-label text-uppercase small text-muted fw-bold">Full Name</label>
                            <div class="input-icon-wrapper" style="position: relative;">
                                <input type="text" class="form-control py-3" id="fullName" required style="padding-left: 16px;" />
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-uppercase small text-muted fw-bold">Email Address</label>
                            <input type="email" class="form-control py-3 bg-light text-muted" id="email" disabled style="padding-left: 16px; border-style: dashed;" />
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-uppercase small text-muted fw-bold">Phone Number</label>
                            <input type="tel" class="form-control py-3" id="phone" style="padding-left: 16px;" placeholder="Enter phone number..." />
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-uppercase small text-muted fw-bold">Delivery Address</label>
                            <textarea class="form-control py-3" id="address" rows="3" style="padding-left: 16px;" placeholder="Default delivery address details..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-6 mt-2">
                            💾 Save Profile Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
