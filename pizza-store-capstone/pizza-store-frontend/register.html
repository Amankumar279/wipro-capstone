<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Store — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-page-bg">
    <div class="auth-blobs-container">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">🍕 Pizza Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
            </div>
        </div>
    </nav>

    <div class="auth-center-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="modern-form-card">
                        <div class="form-icon">👤</div>
                        <h2 class="form-title">Create Account</h2>

                        <div id="alertBox"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">👤</span>
                                    <input type="text" class="form-control form-control-icon" id="fullName"
                                        placeholder="John Doe" required />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">📱</span>
                                    <input type="tel" class="form-control form-control-icon" id="phone"
                                        placeholder="9876543210" />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">📧</span>
                                    <input type="email" class="form-control form-control-icon" id="email"
                                        placeholder="john@example.com" required />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password (min 6 characters)</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">🔒</span>
                                    <input type="password" class="form-control form-control-icon" id="password"
                                        minlength="6" placeholder="••••••••" required />
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Delivery Address</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">📍</span>
                                    <textarea class="form-control form-control-icon" id="address" rows="2"
                                        placeholder="Your delivery address..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 btn-auth">
                                Create Account →
                            </button>
                        </form>

                        <div class="auth-divider">
                            <span>or</span>
                        </div>

                        <p class="text-center mb-0 small text-white-50">
                            Already have an account? <a href="login.html" class="modern-link">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
