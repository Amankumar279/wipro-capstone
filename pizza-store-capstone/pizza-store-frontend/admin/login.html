<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Store — Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="auth-page-bg">
    <div class="auth-blobs-container">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="../index.html">🍕 Pizza Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
            </div>
        </div>
    </nav>

    <div class="auth-center-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="modern-form-card">
                        <div class="form-icon">🛡️</div>
                        <h2 class="form-title">Admin Console</h2>

                        <div id="alertBox"></div>

                        <form id="adminLoginForm">
                            <div class="mb-4">
                                <label class="form-label">Admin Email</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">📧</span>
                                    <input type="email" class="form-control form-control-icon" id="email"
                                        placeholder="admin@example.com" value="" required />
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <div class="input-icon-wrapper">
                                    <span class="input-icon">🔒</span>
                                    <input type="password" class="form-control form-control-icon" id="password"
                                        placeholder="••••••••" value="" required />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 btn-auth">
                                Login to Dashboard →
                            </button>
                        </form>



                        <p class="text-center mb-0 small text-muted mt-3">
                            <a href="../index.html" class="modern-link">← Back to Customer Home</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="js/admin-login.js"></script>
</body>

</html>
