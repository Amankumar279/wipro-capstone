<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin — Manage Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg admin-navbar">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">🍕 Admin Panel</a>
            <button class="navbar-toggler navbar-dark border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                    <a class="nav-link text-white active" href="menu.html">Manage Menu</a>
                    <a class="nav-link text-white" href="orders.html">Orders</a>
                    <a class="nav-link text-white" href="revenue.html">Revenue</a>
                    <a class="nav-link text-white" href="#" onclick="logout(); return false;">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Admin Page Header Banner -->
    <div class="page-banner" style="background: linear-gradient(135deg, #0f0f15 0%, #151522 50%, #0a0a0f 100%);">
        <div class="container">
            <span class="page-banner-tag"
                style="background: rgba(249, 115, 22, 0.15); color: var(--secondary); border: 1px solid rgba(249, 115, 22, 0.25);">Catalog</span>
            <h1 class="page-banner-title"
                style="background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Manage Menu</h1>
            <p class="page-banner-desc text-white-50">Create new items, set category classifications, price values, and
                configure bestseller or new tags.</p>
        </div>
    </div>

    <div class="container" style="padding-bottom: 80px;">
        <div id="alertBox"></div>

        <!-- Add new item form -->
        <div class="card mb-5 border-0 shadow-sm"
            style="border-radius: var(--radius-md); overflow: hidden; background: #ffffff;">
            <div class="card-header py-3"
                style="background: rgba(225, 29, 72, 0.02); border-bottom: 1px solid rgba(0, 0, 0, 0.05);">
                <h5 class="fw-bold mb-0 text-main">✨ Add New Item</h5>
            </div>
            <div class="card-body p-4">
                <form id="addItemForm" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-uppercase small text-muted fw-bold">Item Name</label>
                        <input type="text" class="form-control" id="name" placeholder="e.g., Margherita Supreme"
                            required />
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-uppercase small text-muted fw-bold">Price (₹)</label>
                        <input type="number" class="form-control" id="price" placeholder="Price" step="0.01" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-uppercase small text-muted fw-bold">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="PIZZA">🍕 Pizza</option>
                            <option value="SIDES">🍟 Sides</option>
                            <option value="BEVERAGES">🥤 Beverages</option>
                            <option value="COMBO">🎁 Combo</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-uppercase small text-muted fw-bold">Image URL</label>
                        <input type="text" class="form-control" id="imageUrl" placeholder="Optional" />
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-uppercase small text-muted fw-bold">Stock</label>
                        <input type="number" class="form-control" id="stockQuantity" placeholder="0" min="0" value="50"
                            required />
                    </div>
                    <div class="col-12">
                        <label class="form-label text-uppercase small text-muted fw-bold">Description</label>
                        <input type="text" class="form-control" id="description"
                            placeholder="A rich, mouthwatering description of flavor ingredients..." />
                    </div>
                    <div class="col-md-8 d-flex align-items-center gap-4 py-2">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="bestseller" />
                            <label class="form-check-label text-muted small fw-bold" for="bestseller">🏷️ Bestseller
                                Tag</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="newLaunch" />
                            <label class="form-check-label text-muted small fw-bold" for="newLaunch">🏷️ New Launch
                                Tag</label>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                            ➕ Add Item to Menu
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Items table -->
        <div class="card border-0 shadow-sm"
            style="border-radius: var(--radius-md); overflow: hidden; background: #ffffff;">
            <div class="card-header py-3"
                style="background: rgba(225, 29, 72, 0.02); border-bottom: 1px solid rgba(0, 0, 0, 0.05);">
                <h5 class="fw-bold mb-0 text-main">📋 Current Menu Items</h5>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width: 60px;">ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Tags</th>
                                <th style="width: 180px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTable">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">Loading menu items...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->

    <div class="modal fade" id="editItemModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        ✏️ Edit Menu Item
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label>Name</label>
                            <input type="text" id="editName" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Price</label>
                            <input type="number" id="editPrice" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Category</label>

                            <select id="editCategory" class="form-select">

                                <option value="PIZZA">
                                    🍕 Pizza
                                </option>

                                <option value="SIDES">
                                    🍟 Sides
                                </option>

                                <option value="BEVERAGES">
                                    🥤 Beverages
                                </option>

                                <option value="COMBO">
                                    🎁 Combo
                                </option>

                            </select>
                        </div>

                        <div class="col-md-6">
                            <label>Stock</label>

                            <input type="number" id="editStock" class="form-control">
                        </div>

                        <div class="col-md-12">
                            <label>Image URL</label>

                            <input type="text" id="editImageUrl" class="form-control">
                        </div>

                        <div class="col-md-12">
                            <label>Description</label>

                            <textarea id="editDescription" rows="3" class="form-control">
                    </textarea>
                        </div>

                        <div class="col-md-6">

                            <div class="form-check">

                                <input type="checkbox" id="editBestseller" class="form-check-input">

                                <label class="form-check-label">
                                    Bestseller
                                </label>

                            </div>

                        </div>

                        <div class="col-md-6">

                            <div class="form-check">

                                <input type="checkbox" id="editNewLaunch" class="form-check-input">

                                <label class="form-check-label">
                                    New Launch
                                </label>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-success" onclick="updateItem()">
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="js/admin-menu.js"></script>
</body>

</html>
