<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin — Revenue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg admin-navbar">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🍕 Admin Panel</a>
        <button class="navbar-toggler navbar-dark border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                <a class="nav-link text-white" href="menu.html">Manage Menu</a>
                <a class="nav-link text-white" href="orders.html">Orders</a>
                <a class="nav-link text-white active" href="revenue.html">Revenue</a>
                <a class="nav-link text-white" href="#" onclick="logout(); return false;">Logout</a>
            </div>
        </div>
    </div>
</nav>

<!-- Admin Page Header Banner -->
<div class="page-banner" style="background: linear-gradient(135deg, #0f0f15 0%, #151522 50%, #0a0a0f 100%);">
    <div class="container">
        <span class="page-banner-tag" style="background: rgba(249, 115, 22, 0.15); color: var(--secondary); border: 1px solid rgba(249, 115, 22, 0.25);">Financials</span>
        <h1 class="page-banner-title" style="background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Revenue Analytics</h1>
        <p class="page-banner-desc text-white-50">Select financial periods, generate automated revenue reports, and overview transaction aggregates.</p>
    </div>
</div>

<div class="container" style="padding-bottom: 80px;">
    <div id="alertBox"></div>

    <!-- Revenue selector form -->
    <div class="card mb-5 border-0 shadow-sm" style="border-radius: var(--radius-md); overflow: hidden; background: #ffffff;">
        <div class="card-header py-3" style="background: rgba(225, 29, 72, 0.02); border-bottom: 1px solid rgba(0, 0, 0, 0.05);">
            <h5 class="fw-bold mb-0 text-main">🔍 Generate Monthly Report</h5>
        </div>
        <div class="card-body p-4">
            <form id="revenueForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label text-uppercase small text-muted fw-bold">Select Year</label>
                    <input type="number" class="form-control py-3" id="year" placeholder="Year" value="2026" required />
                </div>
                <div class="col-md-5">
                    <label class="form-label text-uppercase small text-muted fw-bold">Select Month</label>
                    <select class="form-select py-3" id="month" required>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6" selected>June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                        📊 Show Report
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="revenueResult">
        <p class="text-muted text-center">Use the form above to select a period and fetch revenue records.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-revenue.js"></script>
</body>
</html>
