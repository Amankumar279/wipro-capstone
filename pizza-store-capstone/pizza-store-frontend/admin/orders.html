<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin — Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg admin-navbar">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🍕 Admin Panel</a>
        <button class="navbar-toggler navbar-dark border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                <a class="nav-link text-white" href="menu.html">Manage Menu</a>
                <a class="nav-link text-white active" href="orders.html">Orders</a>
                <a class="nav-link text-white" href="revenue.html">Revenue</a>
                <a class="nav-link text-white" href="#" onclick="logout(); return false;">Logout</a>
            </div>
        </div>
    </div>
</nav>

<!-- Admin Page Header Banner -->
<div class="page-banner" style="background: linear-gradient(135deg, #0f0f15 0%, #151522 50%, #0a0a0f 100%);">
    <div class="container">
        <span class="page-banner-tag" style="background: rgba(249, 115, 22, 0.15); color: var(--secondary); border: 1px solid rgba(249, 115, 22, 0.25);">Orders</span>
        <h1 class="page-banner-title" style="background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">All Customer Orders</h1>
        <p class="page-banner-desc text-white-50">Filter orders by transaction and fulfillment status, process new orders, and update ongoing deliveries.</p>
    </div>
</div>

<div class="container" style="padding-bottom: 80px;">
    <div id="alertBox"></div>

    <div class="filter-bar">
        <div class="row align-items-center">
            <div class="col-md-4 col-lg-3">
                <label class="form-label text-uppercase small text-muted fw-bold">Filter by Status</label>
                <select class="form-select py-3" id="statusFilter">
                    <option value="">📁 All Statuses</option>
                    <option value="PLACED">Placed</option>
                    <option value="ACCEPTED">Accepted</option>
                    <option value="REJECTED">Rejected</option>
                    <option value="PREPARING">Preparing</option>
                    <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                    <option value="DELIVERED">Delivered</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
        </div>
    </div>

    <h5 class="fw-bold mb-4 text-main">Order Catalog</h5>
    <div id="ordersList">
        <p class="text-muted">Loading orders catalog...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-orders.js"></script>
</body>
</html>
