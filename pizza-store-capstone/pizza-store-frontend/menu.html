<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Store — Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">🍕 Pizza Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
            </div>
        </div>
    </nav>

    <!-- Page Header Banner -->
    <div class="page-banner">
        <div class="container">
            <span class="page-banner-tag">Explore</span>
            <h1 class="page-banner-title">Our Menu</h1>
            <p class="page-banner-desc">Discover our handcrafted pizzas, sides, combos and more</p>
        </div>
    </div>

    <div class="container" style="padding-top: 40px; padding-bottom: 60px;">
        <div id="alertBox"></div>

        <!-- Filter bar -->
        <div class="filter-bar">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">CATEGORY</label>
                    <select class="form-select" id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="PIZZA">Pizza</option>
                        <option value="SIDES">Sides</option>
                        <option value="BEVERAGES">Beverages</option>
                        <option value="COMBO">Combo</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">SEARCH</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by name..." />
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" id="searchBtn">
                        🔍 Search
                    </button>
                </div>
            </div>
        </div>

        <div id="menuItems" class="row g-4">
            <p class="text-muted text-center">Loading menu...</p>
        </div>
    </div>

    <footer>
        <span class="footer-brand">🍕 Pizza Store</span>
        <p>© 2026 Pizza Store — Capstone Project. Made with ❤️</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
